<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--cream:#f3f0e7;--olive:#3a4320;--olive2:#4e5a2b;--ink:#17160f;--mut:#5d5a4b;--line:#bdb6a0;
 --serif:"Bodoni Moda",Georgia,serif;--body:"Source Serif 4",Georgia,serif;--sans:"Archivo",system-ui,sans-serif;--hand:"Caveat",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#c9ccc4;-webkit-font-smoothing:antialiased}
body{padding:30px 16px 100px;display:flex;flex-direction:column;align-items:center;gap:40px}
.bar{position:sticky;top:0;z-index:9;display:flex;gap:12px;align-items:center;background:#20241a;color:#eef0e6;padding:12px 18px;border-radius:10px;font:13px var(--sans)}
.bar button{min-height:40px;padding:0 14px;border:0;border-radius:7px;background:#eef0e6;color:#20241a;cursor:pointer;font:12px var(--sans)}
.frame{width:min(1080px,calc(100vw - 32px))}
.scaler{width:1080px;transform-origin:top left}
.sheet{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cream);color:var(--ink);isolation:isolate}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.sheet::before{content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(180deg,rgba(243,240,231,.97) 0%,rgba(243,240,231,.95) 48%,rgba(243,240,231,.6) 66%,rgba(243,240,231,0) 84%)}
.sheet.c1::before{background:linear-gradient(180deg,rgba(243,240,231,.25) 0%,rgba(243,240,231,0) 35%)}
.sheet.c1.ltb::after{height:150px;background:linear-gradient(0deg,rgba(243,240,231,.8),rgba(243,240,231,0))}
.sheet.s::before{background:linear-gradient(180deg,rgba(243,240,231,.98) 0%,rgba(243,240,231,.96) 56%,rgba(243,240,231,.5) 68%,rgba(243,240,231,0) 80%)}
.sheet.dkb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:300px;z-index:-1;background:linear-gradient(0deg,rgba(10,10,8,.62),rgba(10,10,8,0))}
.sheet.ltb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:260px;z-index:-1;background:linear-gradient(0deg,rgba(243,240,231,.94),rgba(243,240,231,0))}
.pad{position:absolute;inset:64px 72px 56px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{font:700 22px var(--sans);letter-spacing:.2em;color:var(--ink)}
.brand span{font-weight:400}
.brand .r{height:2px;width:240px;background:var(--ink);margin:10px 0 12px}
.brand .no{font:600 22px var(--sans);letter-spacing:.1em;color:var(--ink)}
.motto{font:600 20px var(--sans);letter-spacing:.18em;line-height:1.55;color:var(--ink)}
.top2{display:block}
.brandrow{display:flex;align-items:center;gap:14px;font:400 32px var(--sans);letter-spacing:.01em;color:var(--ink)}
.brandrow b{font-weight:800}
.brandrow .ln{flex:1;height:1.5px;background:var(--ink);opacity:.8;min-width:30px}
.brandrow .motto2{font:500 19px var(--sans);letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.no2{font:500 24px var(--sans);letter-spacing:.06em;color:var(--ink);margin-top:6px}
.foot{border-top:1.5px solid rgba(23,22,15,.7);padding-top:20px}
.foot.dk{border-top-color:rgba(255,255,255,.7)}
.foot .n::after{display:none!important}
.cnt{position:absolute;right:0;top:128px;font:500 17px var(--sans);letter-spacing:.14em;color:var(--mut)}
h1,h2{font-family:var(--serif);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;margin-top:70px}
h1{font-size:112px}
h2{font-size:92px;margin-top:62px}
h1 em,h2 em{font-style:normal;color:var(--olive)}
.sub{font:italic 500 52px/1.12 var(--serif);margin-top:34px;max-width:760px}
.rule{width:96px;height:2px;background:var(--ink);margin:34px 0}
.txt{font:400 31px/1.34 var(--body);max-width:700px}
.txt b{font-weight:700;color:var(--olive)}
.kick{font:700 25px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:28px 0 16px}
.list{display:flex;flex-direction:column;gap:18px;max-width:820px}
.list.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;max-width:none}
.list.g2 .it{align-items:flex-start;gap:20px;min-width:0}
.list.g2 .ic{width:72px;height:72px}
.list.g2 .it .t{font-size:30px}
.list.g2 .it .d{font-size:27px}
.it{display:flex;align-items:center;gap:26px}
.ic{flex:none;width:84px;height:84px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 28px var(--serif);background:rgba(243,240,231,.7)}
.it .sep{width:2px;align-self:stretch;background:var(--ink);opacity:.8}
.it .t{font:700 33px var(--serif);text-transform:uppercase;line-height:1.05}
.it .d{font:500 29px/1.25 var(--body);margin-top:3px}
.hand{font:600 44px/1 var(--hand);color:var(--ink);position:absolute;transform:rotate(-6deg)}
.box{position:absolute;left:72px;bottom:150px;background:var(--olive);color:var(--cream);padding:30px 38px;max-width:760px}
.box .s{font:500 25px var(--serif);text-transform:uppercase;letter-spacing:.03em}
.box .b{font:700 41px/1.08 var(--serif);text-transform:uppercase;margin-top:8px}
.rail{position:absolute;right:72px;top:560px;width:260px;text-align:center;font:600 22px var(--sans);letter-spacing:.22em;color:var(--ink)}
.rail i{display:block;width:2px;height:48px;background:var(--ink);margin:14px auto}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font:600 19px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);position:relative}
.foot.dk{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.foot .n{font-size:24px;letter-spacing:.14em}
.foot .n::after{content:"";display:inline-block;width:70px;height:2px;background:currentColor;margin-left:16px;vertical-align:middle}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin-top:26px}
.chip{border:2px solid var(--ink);padding:20px 24px;background:rgba(243,240,231,.78)}
.chip .t{font:700 24px var(--sans);letter-spacing:.06em;color:var(--olive);margin-bottom:8px}
.chip .d{font:500 30px/1.15 var(--serif)}
@media print{.bar{display:none}}

<h1>Corpo tem<br><em>limite.</em></h1>
<p class="txt" style="margin-top:34px">Espessante abafa gosto e aroma — mas só acima do ponto em que as cadeias se entrelaçam (<b>c*</b>).</p>
<div class="two"><div class="chip"><div class="t">Abaixo de c*</div><div class="d">Corpo, sem perder sabor.</div></div>
<div class="chip"><div class="t">Acima de c*</div><div class="d">O drink fica “surdo”.</div></div></div><div class="foot dk"><span>Salve · Compartilhe</span></div></div><div class="box" style="bottom:180px;max-width:820px"><div class="b" style="margin-top:0">Seu drink tem corpo,<br>ou só açúcar?</div></div></section></template>
<script>
const solo=(location.hash.match(/solo=(\d+)/)||[])[1];
const stage=document.getElementById('stage');
document.getElementById('tpl').content.querySelectorAll('.sheet').forEach((s,i)=>{
  if(solo&&i+1!=solo)return;
  const f=document.createElement('div');f.className='frame';
  const sc=document.createElement('div');sc.className='scaler';sc.appendChild(s.cloneNode(true));f.appendChild(sc);stage.appendChild(f);
});
if(solo){document.querySelector('.bar').remove();document.body.style.cssText='padding:0;gap:0;background:#f3f0e7';document.querySelector('.frame').style.width='1080px';}
function fit(){if(solo)return;document.querySelectorAll('.frame').forEach(f=>{const s=f.clientWidth/1080;f.querySelector('.scaler').style.transform='scale('+s+')';f.style.height=(1350*s)+'px';});}
addEventListener('resize',fit);addEventListener('load',fit);fit();
async function exportAll(){const fr=[...document.querySelectorAll('.frame')];
 for(let i=0;i<fr.length;i++){const sc=fr[i].querySelector('.scaler'),p=sc.style.transform;sc.style.transform='none';
  const c=await html2canvas(sc.querySelector('.sheet'),{scale:2,width:1080,height:1350,windowWidth:1080,useCORS:true});
  sc.style.transform=p;const a=document.createElement('a');a.download='cs08-corpo-'+(i+1)+'.png';a.href=c.toDataURL('image/png');a.click();await new Promise(r=>setTimeout(r,350));}}
</script></body></html>
